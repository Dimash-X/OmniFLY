/motion_capture_tracking:
  ros__parameters:
    type: "optitrack"
    hostname: "192.168.1.100"        # TODO: IP of your Motive/OptiTrack PC

    mode: "libobjecttracker"         # one of motionCapture, libRigidBodyTracker

    topics:
      poses:
        qos:
          mode: "sensor"
          deadline: 100.0 # Hz

    marker_configurations:
      # TODO: MEASURE on the real frame. Marker pattern must be ASYMMETRIC,
      # points in metres relative to the frame centre. Use tiny/light markers:
      # the 2.5" frame has very little payload margin.
      omnifly_4marker:
        offset: [0.0, 0.0, -0.01]
        points:
          p0: [ 0.000,  0.000, 0.030]  # top
          p1: [-0.040,  0.040, 0.010]  # back left
          p2: [-0.040, -0.040, 0.010]  # back right
          p3: [ 0.055, -0.035, 0.010]  # front right (shifted -> asymmetric)

    dynamics_configurations:
      omnifly:
        max_velocity: [1.5, 1.5, 2]          # m/s
        max_angular_velocity: [30, 30, 15]   # rad/s (small frame turns fast)
        max_roll: 1.4
        max_pitch: 1.4
        max_fitness_score: 0.003             # looser: less accurate small marker set

    # rigid_bodies are generated by omnifly.launch.py from drones.yaml
